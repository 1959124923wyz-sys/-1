<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>德国犯罪态势地图 · Germany Crime Situation Monitor</title>
<meta name="description" content="德国犯罪态势可视化：BKA官方年度统计底图、近90天警方公开通报点、柏林高覆盖局部数据叠加。">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#0c1117;--panel:#131a22;--panel2:#19222c;--line:#2c3845;--text:#eef3f7;--muted:#91a0ae;
  --red:#d6534f;--orange:#df8a45;--blue:#4f95bd;--purple:#9e76c8;--property:#5a82d3;
  --accent:#70b4e2;--green:#4fb87a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.45 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
body{overflow:hidden;display:flex;flex-direction:column}
header{flex:0 0 auto;background:var(--bg);border-bottom:1px solid var(--line);padding:11px 18px 9px}
.header-main{display:flex;justify-content:space-between;gap:18px;align-items:center}.titleblock{min-width:0}
.kicker{font-size:10px;color:#75b5df;letter-spacing:.15em}.title{font-size:clamp(21px,2.1vw,31px);font-weight:760;line-height:1.08;margin:3px 0}
.subtitle{font-size:11.5px;color:var(--muted);margin:0;max-width:980px}
.topstat{display:flex;gap:13px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);white-space:nowrap}
.topstat b{font-size:24px;line-height:1}.topstat small{display:block;color:var(--muted);font-size:9.5px}.vline{width:1px;height:30px;background:var(--line)}
.modebar{margin-top:8px;padding-top:8px;border-top:1px solid #202a34;display:flex;align-items:center;gap:7px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.modebar::-webkit-scrollbar{display:none}
.mode-label{font-size:10px;color:var(--muted);letter-spacing:.08em;margin-right:2px}
.modebtn{border:1px solid #354351;background:#131b24;color:#d7e0e8;border-radius:999px;padding:5px 10px;cursor:pointer;font-size:11px}
.modebtn.active{background:#24384a;border-color:#5386aa;color:white;box-shadow:inset 0 0 0 1px #5386aa}
.windowpill,.sourcepill{border:1px solid #34404b;border-radius:999px;padding:4px 8px;font-size:10px;color:#b9c5cf}.windowpill{color:#dfe8ef}.sourcepill{color:#7fc0e9}

main{flex:1 1 auto;min-height:480px;display:grid;grid-template-columns:minmax(0,1fr) min(420px,34vw);overflow:hidden}
.mapwrap{position:relative;min-width:0;background:#c4d4de}#map{width:100%;height:100%;background:#c8d9e4}
aside{height:100%;min-height:0;overflow:hidden;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column}
.controls{flex:0 0 auto;background:var(--panel2);border-bottom:1px solid var(--line);padding:9px 11px}
.control-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 7px}.control-row[hidden]{display:none!important}.control-row:last-child{margin-bottom:0}
.control-row strong{font-size:10px;color:var(--muted);letter-spacing:.06em;margin-right:2px}.control-row label{display:flex;align-items:center;gap:4px;font-size:10.5px}.control-row input{margin:0;accent-color:#65a4d2}
.control-row select,.control-row button{background:#10171f;color:var(--text);border:1px solid #354250;border-radius:6px;padding:4px 6px;font-size:10.5px}
.control-row button{cursor:pointer}.control-row button:hover{background:#263340}
.cat{display:inline-flex!important;align-items:center;gap:5px!important;padding:3px 7px;border:1px solid #34414e;border-radius:999px}.cat i{width:7px;height:7px;border-radius:50%}.h i{background:var(--red)}.v i{background:var(--orange)}.r i{background:var(--blue)}.s i{background:var(--purple)}.p i{background:var(--property)}
.mode-note{font-size:10px;color:var(--muted);padding:8px 11px;border-bottom:1px solid var(--line)}
.summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:7px 10px;border-bottom:1px solid var(--line);background:#111820}
.summary-box{background:#18212b;border:1px solid #293643;border-radius:7px;padding:6px 7px;min-width:0}.summary-box b{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis}.summary-box small{font-size:8.5px;color:var(--muted);display:block}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:7px 11px;border-bottom:1px solid var(--line);font-size:10px;color:var(--muted)}
#list{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain}
.card{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #26313c;background:transparent;color:var(--text);padding:9px 11px;cursor:pointer}.card:hover{background:#1b2631}
.cardtop{display:flex;justify-content:space-between;gap:7px}.cardtop b{font-size:11.5px}.badges{display:flex;gap:4px;flex:0 0 auto}.badge{font-size:8.5px;padding:2px 5px;border-radius:999px;color:white}
.badge.homicide{background:#a9413d}.badge.violence{background:#a9652d}.badge.robbery{background:#347592}.badge.sexual{background:#705295}.badge.property{background:#4664a8}.badge.status{background:#596673}
.cardmeta{font-size:9px;color:var(--muted);margin-top:2px}.cardsum{font-size:10.5px;line-height:1.34;margin-top:4px}

.mapstatus,.legend,.layerinfo{position:absolute;z-index:700;background:rgba(12,17,23,.92);border:1px solid #35424e;color:#e5edf3;box-shadow:0 2px 12px rgba(0,0,0,.17);backdrop-filter:blur(4px)}
.mapstatus{right:12px;top:12px;border-radius:999px;padding:5px 9px;font-size:9.5px}.mapstatus:before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;background:#6f7d89}.mapstatus.ok:before{background:var(--green)}.mapstatus.fallback:before{background:#dca23b}
.legend{left:12px;bottom:12px;border-radius:8px;padding:7px 9px;font-size:9.5px;min-width:195px}.legend-title{font-weight:700;margin-bottom:4px}.scale{display:flex;height:7px;border-radius:99px;overflow:hidden;margin:4px 0}.scale span{flex:1}.legend-labels{display:flex;justify-content:space-between;color:#a9b6c1;font-size:8px}
.legend-row{margin-top:3px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}.dh{background:var(--red)}.dv{background:var(--orange)}.dr{background:var(--blue)}.ds{background:var(--purple)}.dp{background:var(--property)}
.layerinfo{right:12px;bottom:12px;border-radius:8px;padding:7px 9px;max-width:330px;font-size:9.5px;line-height:1.35}.layerinfo b{font-size:10.5px}.layerinfo .big{font-size:13px;font-weight:750}.layerinfo small{color:#96a5b2}
.leaflet-tooltip{font-size:10px}.leaflet-popup-content-wrapper{border-radius:8px}.leaflet-popup-content{font-size:11px;line-height:1.4}.leaflet-popup-content h3{font-size:13px;margin:0 0 5px}.leaflet-popup-content p{margin:4px 0}
footer{flex:0 0 34px;border-top:1px solid var(--line);padding:7px 18px;color:var(--muted);font-size:9.5px;display:flex;justify-content:space-between;gap:12px;white-space:nowrap}footer span:first-child{overflow:hidden;text-overflow:ellipsis}

@media(max-width:920px){
  body{overflow:auto;display:block}header{padding:9px 11px}.header-main{align-items:flex-start}.topstat .vline,.topstat>div:last-child{display:none}.topstat{padding:6px 8px}
  main{display:block;height:auto;overflow:visible}.mapwrap{height:60vh;min-height:430px}aside{height:auto;max-height:none;border-left:0;border-top:1px solid var(--line)}#list{max-height:55vh}
  .summary-grid{grid-template-columns:repeat(3,1fr)}.layerinfo{max-width:260px;right:8px;bottom:8px}.legend{left:8px;bottom:8px}footer{height:auto;display:block;white-space:normal;padding:7px 11px}
}
</style>
</head>
<body>
<header>
  <div class="header-main">
    <div class="titleblock">
      <div class="kicker">GERMANY CRIME SITUATION MONITOR</div>
      <div class="title">德国犯罪态势地图</div>
      <p class="subtitle">官方统计面 × 近90天公开通报点 × 柏林高覆盖局部层。年度统计用于空间结构，90天窗口用于近期事件与日更开放数据。</p>
    </div>
    <div class="topstat">
      <div><b id="visibleCount">—</b><small>近90天当前通报点</small></div>
      <div class="vline"></div>
      <div><small id="updated">读取中…</small><small id="datasetTotal"></small></div>
    </div>
  </div>
  <div class="modebar">
    <span class="mode-label">主视图</span>
    <button class="modebtn active" id="modeViolence">暴力犯罪</button>
    <button class="modebtn" id="modeProperty">财产犯罪</button>
    <span class="windowpill">动态窗口：近90天</span>
    <span class="sourcepill" id="officialBadge">BKA PKS 2025 官方结构背景</span>
  </div>
</header>

<main>
  <section class="mapwrap">
    <div id="map"></div>
    <div id="mapStatus" class="mapstatus">底图加载中…</div>
    <div id="legend" class="legend"></div>
    <div id="layerInfo" class="layerinfo"></div>
  </section>

  <aside>
    <div class="controls">
      <div class="control-row" id="violenceLayers">
        <strong>图层</strong>
        <label><input id="showPks" type="checkbox" checked> PKS 2025县级暴力底图</label>
        <label><input id="showBerlinViolence" type="checkbox" checked> 柏林细分暴力层</label>
        <label><input id="showNews" type="checkbox" checked> 90天通报点</label>
      </div>
      <div class="control-row" id="violentCats">
        <strong>通报点</strong>
        <label class="cat h"><input class="catcheck" data-cat="homicide" type="checkbox" checked><i></i>凶杀</label>
        <label class="cat v"><input class="catcheck" data-cat="violence" type="checkbox" checked><i></i>严重暴力</label>
        <label class="cat r"><input class="catcheck" data-cat="robbery" type="checkbox" checked><i></i>抢劫</label>
        <label class="cat s"><input class="catcheck" data-cat="sexual" type="checkbox" checked><i></i>性犯罪</label>
      </div>
      <div class="control-row" id="propertyLayers" hidden>
        <strong>图层</strong>
        <label><input id="showHeat" type="checkbox" checked> 柏林官方盗窃热力</label>
        <select id="heatType"><option value="total">自行车 + 车辆</option><option value="bike">仅自行车</option><option value="vehicle">仅车辆上/车辆内</option></select>
        <label><input id="showPropertyNews" type="checkbox" checked> 90天财产通报点</label>
      </div>
      <div class="control-row">
        <strong>定位</strong>
        <button id="viewGermany" type="button">全国视图</button>
        <button id="focusBerlin" type="button">聚焦柏林</button>
      </div>
    </div>
    <div id="modeNote" class="mode-note"></div>
    <div class="summary-grid">
      <div class="summary-box"><b id="sumA">—</b><small id="sumALabel">统计单元</small></div>
      <div class="summary-box"><b id="sumB">—</b><small id="sumBLabel">近期点</small></div>
      <div class="summary-box"><b id="sumC">—</b><small id="sumCLabel">局部高覆盖</small></div>
    </div>
    <div class="list-head"><span id="listTitle">近90天暴力类公开通报</span><span>点击事件可定位</span></div>
    <div id="list"></div>
  </aside>
</main>

<footer>
  <span>BKA PKS 2025用于年度结构性比较；近期点为公开警方/检察机关通报，并非全量案件。</span>
  <span>90天动态层每日更新 · 柏林开放数据按官方发布刷新</span>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="vendor/leaflet-heat.js"></script>
<script>
(() => {
  const $=id=>document.getElementById(id);
  const el={
    visibleCount:$('visibleCount'),updated:$('updated'),datasetTotal:$('datasetTotal'),
    modeViolence:$('modeViolence'),modeProperty:$('modeProperty'),officialBadge:$('officialBadge'),
    showPks:$('showPks'),showBerlinViolence:$('showBerlinViolence'),showNews:$('showNews'),
    showHeat:$('showHeat'),heatType:$('heatType'),showPropertyNews:$('showPropertyNews'),
    violenceLayers:$('violenceLayers'),violentCats:$('violentCats'),propertyLayers:$('propertyLayers'),
    viewGermany:$('viewGermany'),focusBerlin:$('focusBerlin'),mapStatus:$('mapStatus'),
    legend:$('legend'),layerInfo:$('layerInfo'),modeNote:$('modeNote'),
    sumA:$('sumA'),sumB:$('sumB'),sumC:$('sumC'),sumALabel:$('sumALabel'),sumBLabel:$('sumBLabel'),sumCLabel:$('sumCLabel'),
    listTitle:$('listTitle'),list:$('list')
  };
  const NATIONAL_VIOLENCE_2025=212335;
  const cats={homicide:{label:'凶杀',color:'#d6534f'},violence:{label:'严重暴力',color:'#df8a45'},robbery:{label:'抢劫',color:'#4f95bd'},sexual:{label:'性犯罪',color:'#9e76c8'},property:{label:'盗窃/财产',color:'#5a82d3'}};
  let mode='violence',caseData=null,pksData=null,countyGeo=null,berlinViolence=null,heatData=null,stateGeo=null;
  let countyLayer=null,berlinLayer=null,heatLayer=null,stateLayer=null;
  const newsLayer=L.layerGroup(),markers=new Map();

  const map=L.map('map',{minZoom:5,maxZoom:17,zoomControl:true,preferCanvas:true,worldCopyJump:false});
  const germanyBounds=L.latLngBounds([[47.05,5.45],[55.15,15.65]]);
  const berlinBounds=L.latLngBounds([[52.33,13.08],[52.69,13.77]]);
  map.fitBounds(germanyBounds,{padding:[14,14]});map.setMaxBounds([[45.3,3.2],[57.1,18.0]]);
  map.createPane('countyPane');map.getPane('countyPane').style.zIndex=230;
  map.createPane('statePane');map.getPane('statePane').style.zIndex=245;
  map.createPane('berlinPane');map.getPane('berlinPane').style.zIndex=260;
  map.createPane('newsPane');map.getPane('newsPane').style.zIndex=460;
  newsLayer.addTo(map);

  let tileOk=false,tileErrors=0;
  const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors',crossOrigin:true,updateWhenIdle:true});
  tiles.on('tileload',()=>{if(!tileOk){tileOk=true;el.mapStatus.className='mapstatus ok';el.mapStatus.textContent='OSM街道底图 + 本地统计图层';}});
  tiles.on('tileerror',()=>{tileErrors++;if(tileErrors>=6&&!tileOk){if(map.hasLayer(tiles))map.removeLayer(tiles);el.mapStatus.className='mapstatus fallback';el.mapStatus.textContent='本地统计底图（OSM当前不可用）';}});
  tiles.addTo(map);
  setTimeout(()=>{if(!tileOk){if(map.hasLayer(tiles))map.removeLayer(tiles);el.mapStatus.className='mapstatus fallback';el.mapStatus.textContent='本地统计底图（OSM当前不可用）';}},4000);

  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt=n=>Number(n||0).toLocaleString('zh-CN');
  const pd=s=>{const [y,m,d]=String(s||'').split('-');return y&&m&&d?d+'.'+m+'.'+y:String(s||'')};
  const safe=u=>/^https:\/\//i.test(String(u||''))?u:'#';

  function scaleColor(v,breaks,palette){
    if(v==null||!Number.isFinite(Number(v)))return '#c8d1d8';
    const n=Number(v);
    for(let i=0;i<breaks.length;i++)if(n<=breaks[i])return palette[i];
    return palette[palette.length-1];
  }
  const nationalPalette=['#dceff0','#a9d5d5','#79b8b8','#e1b765','#d96a4f'];
  const berlinPalette=['#f1e8f7','#d6b8e7','#bc8bd5','#9b5fbe','#74389b'];

  function pksRecord(feature){
    const id=String(feature?.id??feature?.properties?.AGS??'').padStart(5,'0');
    const alias=pksData?.meta?.geometry_aliases?.[id];
    return pksData?.records?.[id]||pksData?.records?.[alias]||null;
  }
  function nationalStyle(feature){
    const rec=pksRecord(feature),breaks=pksData?.meta?.quantile_breaks||[180,240,300,380];
    return {pane:'countyPane',color:'#607685',weight:.45,fillColor:rec?scaleColor(rec.violence?.rate,breaks,nationalPalette):'#cbd4d9',fillOpacity:(rec&&rec.violence&&rec.violence.rate!=null)?0.48:0.07};
  }
  function berlinStyle(feature){
    const v=Number(feature?.properties?.combined_rate||0),breaks=berlinViolence?.meta?.quantile_breaks||[150,220,300,420];
    return {pane:'berlinPane',color:'#694d77',weight:.35,opacity:.42,fillColor:scaleColor(v,breaks,berlinPalette),fillOpacity:.64};
  }
  function buildCountyLayer(){
    if(countyLayer){map.removeLayer(countyLayer);countyLayer=null;}
    if(mode!=='violence'||!el.showPks.checked||!countyGeo||!pksData)return;
    countyLayer=L.geoJSON(countyGeo,{
      pane:'countyPane',style:nationalStyle,
      onEachFeature:(feature,layer)=>{
        const r=pksRecord(feature);if(!r)return;
        layer.bindTooltip('<b>'+esc(r.name)+'</b><br>Gewaltkriminalität '+fmt(r.violence.rate)+' /10万',{sticky:true});
        layer.bindPopup(
          '<h3>'+esc(r.name)+'</h3>'+
          '<p><b>BKA PKS 2025 · 暴力犯罪</b></p>'+
          '<p>案件：'+fmt(r.violence.cases)+'<br>每10万人：<b>'+fmt(r.violence.rate)+'</b></p>'+
          '<p>凶杀 '+fmt(r.homicide?.cases)+' · 抢劫 '+fmt(r.robbery?.cases)+'<br>危险/严重伤害 '+fmt(r.serious_injury?.cases)+' · 严重性暴力 '+fmt(r.sexual?.cases)+'</p>'+
          '<p style="font-size:10px;color:#667">年度结构背景，不等于近90天案件量。</p>'
        );
      }
    }).addTo(map);
  }
  function buildStateLayer(){
    if(stateLayer){map.removeLayer(stateLayer);stateLayer=null;}
    if(!stateGeo)return;
    stateLayer=L.geoJSON(stateGeo,{pane:'statePane',style:{color:'#334f63',weight:1.15,fillOpacity:0,interactive:false}}).addTo(map);
  }
  function buildBerlinLayer(){
    if(berlinLayer){map.removeLayer(berlinLayer);berlinLayer=null;}
    if(mode!=='violence'||!el.showBerlinViolence.checked||!berlinViolence||map.getZoom()<7.5)return;
    berlinLayer=L.geoJSON(berlinViolence,{
      pane:'berlinPane',style:berlinStyle,
      onEachFeature:(feature,layer)=>{
        const p=feature.properties||{};
        layer.bindTooltip('<b>'+esc(p.name)+'</b><br>严重暴力代理HZ '+fmt(p.combined_rate)+' /10万',{sticky:true});
        layer.bindPopup('<h3>'+esc(p.name)+'</h3><p><b>Polizei Berlin Kriminalitätsatlas 2025</b></p><p>抢劫：'+fmt(p.robbery_cases)+'（HZ '+fmt(p.robbery_rate)+'）<br>危险/严重身体伤害：'+fmt(p.serious_injury_cases)+'（HZ '+fmt(p.serious_injury_rate)+'）</p><p>组合代理HZ：<b>'+fmt(p.combined_rate)+'</b> /10万</p><p style="font-size:10px;color:#667">高覆盖局部分区层；组合指标≠BKA“Gewaltkriminalität”完整定义。</p>');
      }
    }).addTo(map);
  }
  function buildHeat(){
    if(heatLayer){map.removeLayer(heatLayer);heatLayer=null;}
    if(mode!=='property'||!el.showHeat.checked||!heatData||typeof L.heatLayer!=='function')return;
    const w=heatData.windows?.['90'];if(!w)return;
    const field=el.heatType.value||'total';
    const raw=(w.points||[]).filter(p=>Number(p[field])>0);
    const maxRaw=Math.max(1,...raw.map(p=>Number(p[field])||0)),den=Math.log1p(maxRaw);
    const pts=raw.map(p=>[p.lat,p.lon,Math.log1p(Number(p[field])||0)/den]);
    heatLayer=L.heatLayer(pts,{radius:24,blur:19,maxZoom:13,max:1,minOpacity:.18}).addTo(map);
    if(heatLayer._canvas){heatLayer._canvas.style.opacity='.66';heatLayer._canvas.style.pointerEvents='none';}
  }

  function selectedViolentCats(){
    return new Set([...document.querySelectorAll('.catcheck')].filter(x=>x.checked).map(x=>x.dataset.cat));
  }
  function visibleCases(){
    if(!caseData)return[];
    if(mode==='property')return caseData.cases.filter(c=>c.category==='property'&&el.showPropertyNews.checked);
    const sel=selectedViolentCats();
    return el.showNews.checked?caseData.cases.filter(c=>sel.has(c.category)):[];
  }
  function markerFor(c){
    const meta=cats[c.category]||{label:c.category,color:'#667'};
    const fund=String(c.location_type||'').includes('Fundort'),sus=c.status==='suspected';
    return L.circleMarker([c.lat,c.lon],{pane:'newsPane',radius:c.category==='homicide'?7.5:c.category==='property'?4.5:6.2,weight:fund?3:(sus?2.2:1.5),color:fund?'#fff':meta.color,dashArray:sus&&!fund?'3 2':null,fillColor:meta.color,fillOpacity:sus?.55:.92});
  }
  function popup(c){
    const meta=cats[c.category]||{label:c.category};
    return '<h3>'+esc(c.city)+' · '+pd(c.event_date)+'</h3><p><b>'+esc(meta.label)+'</b> · '+esc(c.offense||'')+' · '+esc(c.status||'')+'</p><p>'+esc(c.location||'')+'</p><p>'+esc(c.summary||'')+'</p><p><a target="_blank" rel="noopener noreferrer" href="'+esc(safe(c.source_url))+'">查看原始通报 ↗</a></p>';
  }
  function renderNews(){
    newsLayer.clearLayers();markers.clear();el.list.innerHTML='';
    const cs=visibleCases().sort((a,b)=>b.event_date.localeCompare(a.event_date)||String(a.city).localeCompare(String(b.city)));
    for(const c of cs){
      if(Number.isFinite(c.lat)&&Number.isFinite(c.lon)){
        const m=markerFor(c).bindPopup(popup(c),{maxWidth:360}).addTo(newsLayer);markers.set(c.id,m);
      }
      const meta=cats[c.category]||{label:c.category};
      const b=document.createElement('button');b.className='card';
      b.innerHTML='<div class="cardtop"><b>'+esc(c.city)+' · '+pd(c.event_date)+'</b><span class="badges"><span class="badge '+esc(c.category)+'">'+esc(meta.label)+'</span><span class="badge status">'+esc(c.status||'')+'</span></span></div><div class="cardmeta">'+esc(c.location||'')+'</div><div class="cardsum">'+esc(c.summary||'')+'</div>';
      b.onclick=()=>{const m=markers.get(c.id);if(m){map.flyTo(m.getLatLng(),Math.max(map.getZoom(),11),{duration:.55});m.openPopup();}else window.open(safe(c.source_url),'_blank','noopener');};
      el.list.appendChild(b);
    }
    el.visibleCount.textContent=fmt(cs.length);
    el.datasetTotal.textContent='数据集 '+fmt(caseData?.cases?.length||0)+' 起';
    if(!cs.length)el.list.innerHTML='<div class="mode-note">当前筛选没有公开通报点。</div>';
    return cs;
  }

  function renderLegend(){
    if(mode==='violence'){
      const b=pksData?.meta?.quantile_breaks||[180,240,300,380];
      el.legend.innerHTML='<div class="legend-title">BKA PKS 2025 · Gewaltkriminalität</div><div>县/市每10万人案件数（年度）</div><div class="scale">'+nationalPalette.map(c=>'<span style="background:'+c+'"></span>').join('')+'</div><div class="legend-labels"><span>低</span><span>'+fmt(b[1]||'')+'</span><span>'+fmt(b[3]||'')+'</span><span>高</span></div><div class="legend-row"><i class="dot dh"></i>凶杀　<i class="dot dv"></i>严重暴力　<i class="dot dr"></i>抢劫　<i class="dot ds"></i>性犯罪</div><div class="legend-row">紫色细分 = 柏林2025高覆盖严重暴力代理层（放大后）</div>';
    }else{
      el.legend.innerHTML='<div class="legend-title">柏林官方 Open Data · 近90天</div><div>自行车盗窃 + 车辆上/车辆内盗窃</div><div class="scale"><span style="background:#2a5fff"></span><span style="background:#00d4ff"></span><span style="background:#7cff5b"></span><span style="background:#ffe54a"></span><span style="background:#ff3b2f"></span></div><div class="legend-labels"><span>低密度</span><span>高密度</span></div><div class="legend-row"><i class="dot dp"></i>蓝点 = 近90天财产类公开通报</div>';
    }
  }
  function renderLayerInfo(cs){
    if(mode==='violence'){
      const n=pksData?.meta?.county_count||0,berlinN=berlinViolence?.meta?.bzr_count||berlinViolence?.meta?.feature_count||0;
      el.layerInfo.innerHTML='<b>三层真相 · 暴力模式</b><div><span class="big">'+fmt(n)+'</span> 个PKS县/市统计单元 · 2025年度</div><div><span class="big">'+fmt(cs.length)+'</span> 个近90天公开通报点</div><div>柏林细分：'+fmt(berlinN)+' 个Bezirksregion（抢劫 + 危险/严重伤害）</div><small>年度统计用于“哪里长期更高”；新闻点用于“最近发生了什么”。</small>';
    }else{
      const w=heatData?.windows?.['90']||{},field=el.heatType.value||'total';
      const n=field==='bike'?w.bike:field==='vehicle'?w.vehicle:w.total;
      const lab=field==='bike'?'自行车盗窃':field==='vehicle'?'车辆上/车辆内盗窃':'自行车 + 车辆盗窃';
      el.layerInfo.innerHTML='<b>柏林官方 Open Data · 90天</b><div><span class="big">'+fmt(n||0)+'</span> 起 '+lab+'</div><div>覆盖 '+fmt(w.active_lor||0)+' 个 Planungsraum</div><div>叠加 '+fmt(cs.length)+' 个财产类公开通报点</div><small>热力为警方结构化记录；仍不等于柏林全部财产犯罪。</small>';
    }
  }
  function renderSummary(cs){
    if(mode==='violence'){
      el.sumA.textContent=fmt(NATIONAL_VIOLENCE_2025);el.sumALabel.textContent='BKA 2025全国暴力犯罪';
      el.sumB.textContent=fmt(cs.length);el.sumBLabel.textContent='90天暴力类通报点';
      el.sumC.textContent=fmt(berlinViolence?.meta?.bzr_count||berlinViolence?.meta?.feature_count||0);el.sumCLabel.textContent='柏林Bezirksregion';
      el.listTitle.textContent='近90天暴力类公开通报';
      el.modeNote.textContent='默认结构：BKA PKS 2025县级暴力犯罪年统计作为全国底图；近90天重大/可定位警方通报作为事件点；放大柏林后叠加2025 Kriminalitätsatlas高覆盖细分层。';
      el.officialBadge.textContent='BKA PKS 2025 官方结构背景';
    }else{
      const w=heatData?.windows?.['90']||{};
      el.sumA.textContent=fmt(w.total||0);el.sumALabel.textContent='柏林90天官方盗窃记录';
      el.sumB.textContent=fmt(cs.length);el.sumBLabel.textContent='90天财产通报点';
      el.sumC.textContent=fmt(w.active_lor||0);el.sumCLabel.textContent='柏林活跃Planungsraum';
      el.listTitle.textContent='近90天财产类公开通报';
      el.modeNote.textContent='财产模式：柏林警方日更结构化盗窃记录形成热力，新闻/警方通报点叠加其上。热力当前覆盖自行车盗窃与车辆上/车辆内盗窃。';
      el.officialBadge.textContent='Polizei Berlin Open Data · 90天';
    }
  }
  function render(){
    el.modeViolence.classList.toggle('active',mode==='violence');el.modeProperty.classList.toggle('active',mode==='property');
    el.violenceLayers.hidden=mode!=='violence';el.violentCats.hidden=mode!=='violence';el.propertyLayers.hidden=mode!=='property';
    buildCountyLayer();buildStateLayer();buildBerlinLayer();buildHeat();
    const cs=renderNews();renderLegend();renderLayerInfo(cs);renderSummary(cs);
  }

  el.modeViolence.onclick=()=>{mode='violence';render();};
  el.modeProperty.onclick=()=>{mode='property';render();if(!berlinBounds.contains(map.getCenter()))map.fitBounds(berlinBounds,{padding:[24,24],maxZoom:10});};
  [el.showPks,el.showBerlinViolence,el.showNews,el.showHeat,el.showPropertyNews].forEach(x=>x.addEventListener('change',render));
  el.heatType.addEventListener('change',render);
  document.querySelectorAll('.catcheck').forEach(x=>x.addEventListener('change',render));
  el.viewGermany.onclick=()=>map.fitBounds(germanyBounds,{padding:[14,14]});
  el.focusBerlin.onclick=()=>map.fitBounds(berlinBounds,{padding:[25,25],maxZoom:10});
  map.on('zoomend',()=>{if(mode==='violence')buildBerlinLayer();});

  Promise.all([
    fetch('data/cases.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('cases '+r.status);return r.json()}),
    fetch('data/germany-counties.geojson',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('counties '+r.status);return r.json()}),
    fetch('data/germany-states.geojson',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('states '+r.status);return r.json()}),
    fetch('data/pks_violent_2025.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('pks '+r.status);return r.json()}),
    fetch('data/berlin_violent_2025.geojson',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('berlin violence '+r.status);return r.json()}),
    fetch('data/berlin_heatmap.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('heat '+r.status);return r.json()})
  ]).then(([cases,counties,states,pks,berlinV,heat])=>{
    caseData=cases;countyGeo=counties;stateGeo=states;pksData=pks;berlinViolence=berlinV;heatData=heat;
    const t=caseData.meta?.generated_at?new Date(caseData.meta.generated_at):null;
    el.updated.textContent=t&&!Number.isNaN(+t)?'通报更新 '+t.toLocaleString():'通报更新时间未知';
    render();
  }).catch(err=>{
    console.error(err);el.modeNote.textContent='地图数据加载失败，请刷新重试：'+err.message;el.updated.textContent='数据加载失败';
  });

  window.__CRIME_MAP__={
    map,getMode:()=>mode,getCaseData:()=>caseData,getPksData:()=>pksData,getBerlinViolence:()=>berlinViolence,getHeatData:()=>heatData,
    getCountyLayer:()=>countyLayer,getBerlinLayer:()=>berlinLayer,getHeatLayer:()=>heatLayer,getVisibleCases:()=>visibleCases()
  };
})();
</script>
</body>
</html>
