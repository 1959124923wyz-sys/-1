name: Saxony city crime atlas probe
on:
  push:
    branches: [main]
    paths:
      - 'dao-radar/site/germany-homicide-map/scripts/probe_saxony_cities_2025.py'
      - '.github/workflows/germany-saxony-city-probe.yml'
      - 'dao-radar/site/germany-homicide-map/requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt
      - run: python dao-radar/site/germany-homicide-map/scripts/probe_saxony_cities_2025.py
