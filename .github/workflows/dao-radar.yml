name: 道行四海每日更新

on:
  schedule:
    # 中国大陆/台湾均为 UTC+8：00:43 UTC = 08:43
    # 使用纯 UTC cron，避免依赖时区扩展；避开整点高峰。
    - cron: '43 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dao-radar/**'
      - '.github/workflows/dao-radar.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dao-radar-pages
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[manual-update]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: dao-radar/requirements.txt

      - name: Install dependencies
        run: pip install -r dao-radar/requirements.txt

      - name: Search and update data
        run: python dao-radar/update.py

      - name: Save new data to repository
        run: |
          if ! git diff --quiet -- dao-radar/site/data.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dao-radar/site/data.json
            git commit -m "data: daily opportunity update"
            git push
          else
            echo "No data changes"
          fi

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dao-radar/site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
