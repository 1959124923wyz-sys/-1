name: Shenzhen map bulk expansion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shenzhen-save-years-bulk.yml'

permissions:
  contents: write

# Keep bulk writes serialized with map refreshes and shared Pages deployments.
concurrency:
  group: shared-github-pages-deployment
  cancel-in-progress: false

jobs:
  bulk-expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dao-radar/site/shenzhen-save-years-map/requirements.txt

      - name: Install dependencies
        run: pip install -r dao-radar/site/shenzhen-save-years-map/requirements.txt

      - name: Scan 100 Fang community pages
        run: python dao-radar/site/shenzhen-save-years-map/scripts/update_prices.py --discover-pages 100 --start-page 1 --detail-limit 0 --delay 0.35

      - name: Run parser tests
        run: python -m unittest discover -s dao-radar/site/shenzhen-save-years-map/tests -p 'test_*.py'

      - name: Commit expanded dataset
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dao-radar/site/shenzhen-save-years-map/data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/shenzhen-save-years-map/data/
          git commit -m "data: bulk expand Shenzhen communities"
          git pull --rebase origin main
          git push
