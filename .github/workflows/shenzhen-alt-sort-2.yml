name: Shenzhen alternate-sort expansion 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shenzhen-alt-sort-2.yml'

permissions:
  contents: write

concurrency:
  group: shenzhen-save-years-map-refresh
  cancel-in-progress: false

jobs:
  expand-sort-2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dao-radar/site/shenzhen-save-years-map/requirements.txt
      - run: pip install -r dao-radar/site/shenzhen-save-years-map/requirements.txt
      - name: Scan price-sort 2
        run: python dao-radar/site/shenzhen-save-years-map/scripts/update_prices.py --discover-pages 50 --start-page 1 --sort-code 2 --detail-limit 0 --delay 0.75
      - name: Run parser tests
        run: python -m unittest discover -s dao-radar/site/shenzhen-save-years-map/tests -p 'test_*.py'
      - name: Commit expanded dataset
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dao-radar/site/shenzhen-save-years-map/data/; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/shenzhen-save-years-map/data/
          git commit -m "data: expand Shenzhen communities via Fang sort 2"
          git pull --rebase origin main
          git push
