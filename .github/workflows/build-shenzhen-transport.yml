name: Shenzhen transport context daily refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '47 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-shenzhen-transport.yml'
      - 'dao-radar/site/shenzhen-save-years-map/scripts/build_transport_context.py'
      - 'dao-radar/site/shenzhen-save-years-map/data/shenzhen-boundary.js'

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize the shared GitHub Pages environment across site publishers.
# The latest source/data must not collide with another active Pages deployment.
concurrency:
  group: shared-github-pages-deployment
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependency
        run: pip install requests

      - name: Refresh roads rail hubs ports and border crossings
        run: python dao-radar/site/shenzhen-save-years-map/scripts/build_transport_context.py

      - name: Commit refreshed transport data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/shenzhen-save-years-map/data/transport_context.*
          if git diff --cached --quiet; then
            echo "No transport data changes"
          else
            git commit -m "data: refresh Shenzhen transport context"
            git pull --rebase origin main
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dao-radar/site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
