name: Bootstrap Shenzhen save-years map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-shenzhen-map.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shenzhen-map-bootstrap
  cancel-in-progress: true

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reassemble and verify project
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/shenzhen-map.part01 \
              .bootstrap/shenzhen-map.part02 \
              .bootstrap/shenzhen-map.part03 \
              .bootstrap/shenzhen-map.part04 \
              .bootstrap/shenzhen-map.part05 > /tmp/shenzhen-map.tgz.b64
          test "$(wc -c < /tmp/shenzhen-map.tgz.b64)" -eq 24684
          echo "d79319477cdab289965791a1215cacb111dba919a85afd1252ae896a1219a53d  /tmp/shenzhen-map.tgz.b64" | sha256sum -c -
          base64 -d /tmp/shenzhen-map.tgz.b64 > /tmp/shenzhen-map.tgz
          echo "757ab3119c581889c780888929d32ef743578637bbd5fbc93e5b89849d049f91  /tmp/shenzhen-map.tgz" | sha256sum -c -
          rm -rf /tmp/shenzhen-bootstrap
          mkdir -p /tmp/shenzhen-bootstrap
          tar -xzf /tmp/shenzhen-map.tgz -C /tmp/shenzhen-bootstrap
          test -f /tmp/shenzhen-bootstrap/shenzhen-save-years-map/index.html
          test -f /tmp/shenzhen-bootstrap/shenzhen-save-years-map/scripts/update_prices.py

      - name: Install site into Pages tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dao-radar/site/shenzhen-save-years-map
          mkdir -p dao-radar/site/shenzhen-save-years-map
          cp -a /tmp/shenzhen-bootstrap/shenzhen-save-years-map/. dao-radar/site/shenzhen-save-years-map/
          rm -rf dao-radar/site/shenzhen-save-years-map/.github
          python -m py_compile dao-radar/site/shenzhen-save-years-map/scripts/update_prices.py
          python -m py_compile dao-radar/site/shenzhen-save-years-map/scripts/build_data.py

      - name: Commit installed map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/shenzhen-save-years-map
          git rm -r .bootstrap
          git rm .github/workflows/bootstrap-shenzhen-map.yml
          git commit -m "feat: deploy Shenzhen save-years map"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dao-radar/site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
