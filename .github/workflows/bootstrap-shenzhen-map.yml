name: Bootstrap Shenzhen save-years map

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-shenzhen-map.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: shenzhen-map-bootstrap
  cancel-in-progress: true

jobs:
  install-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v6

      - name: Install map files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/shenzhen-bootstrap
          cat > /tmp/shenzhen-map.tgz.b64 <<'B64'

B64
          base64 -d /tmp/shenzhen-map.tgz.b64 > /tmp/shenzhen-map.tgz
          tar -xzf /tmp/shenzhen-map.tgz -C /tmp/shenzhen-bootstrap
          rm -rf dao-radar/site/shenzhen-save-years-map
          mkdir -p dao-radar/site/shenzhen-save-years-map
          cp -a /tmp/shenzhen-bootstrap/shenzhen-save-years-map/. dao-radar/site/shenzhen-save-years-map/
          rm -rf dao-radar/site/shenzhen-save-years-map/.github

          cat > .github/workflows/shenzhen-save-years-map.yml <<'REFRESH'
          name: Shenzhen save-years map daily refresh

          on:
            workflow_dispatch:
            schedule:
              - cron: '17 0 * * *'

          permissions:
            contents: write
            pages: write
            id-token: write

          concurrency:
            group: shenzhen-save-years-map-refresh
            cancel-in-progress: true

          jobs:
            refresh-and-deploy:
              runs-on: ubuntu-latest
              timeout-minutes: 25
              environment:
                name: github-pages
              steps:
                - uses: actions/checkout@v6
                - uses: actions/setup-python@v6
                  with:
                    python-version: '3.12'
                    cache: pip
                    cache-dependency-path: dao-radar/site/shenzhen-save-years-map/requirements.txt
                - name: Install dependencies
                  run: pip install -r dao-radar/site/shenzhen-save-years-map/requirements.txt
                - name: Refresh prices and discover communities
                  run: python dao-radar/site/shenzhen-save-years-map/scripts/update_prices.py --discover-pages 8 --delay 1.6
                - name: Commit refreshed data
                  run: |
                    if ! git diff --quiet -- dao-radar/site/shenzhen-save-years-map/data/; then
                      git config user.name "github-actions[bot]"
                      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                      git add dao-radar/site/shenzhen-save-years-map/data/
                      git commit -m "data: refresh Shenzhen save-years map"
                      git push
                    else
                      echo "No data changes"
                    fi
                - uses: actions/configure-pages@v5
                - uses: actions/upload-pages-artifact@v4
                  with:
                    path: dao-radar/site
                - name: Deploy Pages
                  uses: actions/deploy-pages@v4
          REFRESH

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/shenzhen-save-years-map .github/workflows/shenzhen-save-years-map.yml
          git rm .github/workflows/bootstrap-shenzhen-map.yml
          git commit -m "feat: deploy Shenzhen save-years map"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dao-radar/site
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
