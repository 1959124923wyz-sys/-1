name: Diagnose Presseportal pagination
on:
  push:
    branches: [expand-germany-homicide-90d]
    paths:
      - 'dao-radar/site/germany-homicide-map/scripts/diag_pagination.py'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python dao-radar/site/germany-homicide-map/scripts/diag_pagination.py
