name: Backfill Berlin crime categories

on:
  push:
    branches: [fix-berlin-crime-coverage]
    paths:
      - 'dao-radar/site/germany-homicide-map/scripts/update_berlin_categories.py'
      - '.github/workflows/germany-berlin-backfill.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: berlin-crime-backfill
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt
      - name: Backfill direct Polizei Berlin source
        env:
          BERLIN_LOOKBACK_DAYS: '90'
        run: python dao-radar/site/germany-homicide-map/scripts/update_berlin_categories.py
      - name: Commit Berlin backfill
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/germany-homicide-map/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: backfill Polizei Berlin crime releases"
            git push
          else
            echo "No Berlin backfill changes"
          fi
