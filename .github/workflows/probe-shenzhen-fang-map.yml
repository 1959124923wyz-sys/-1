name: Probe Shenzhen Fang map endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-shenzhen-fang-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public map JS endpoints
        shell: python
        run: |
          import requests,re
          h={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36","Referer":"https://map.fang.com/"}
          js="https://static.soufunimg.com/map/ditu/js/modules/vueMap/js/app.js?v=20250820001"
          r=requests.get(js,headers=h,timeout=25)
          print("STATUS",r.status_code,"LEN",len(r.content))
          t=r.text
          pats=[
            r'https?[^"\']{0,180}',
            r'[^"\']*(?:ajax|search|map)[^"\']*(?:api|house|loupan|esf|build)[^"\']*',
            r'[^"\']*(?:api|interface|service)[^"\']{0,180}'
          ]
          hits=[]
          for p in pats:
            for m in re.findall(p,t,re.I):
              if any(k in m.lower() for k in ("soufun","fang","api","ajax","search","map")):
                x=m[:240]
                if x not in hits:hits.append(x)
          print("HITS")
          for x in hits[:250]: print(repr(x))
