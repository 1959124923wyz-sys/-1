name: Probe Shenzhen Fang list structure

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-shenzhen-fang-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Fang community list HTML
        shell: python
        run: |
          import requests
          from bs4 import BeautifulSoup
          h={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36","Accept-Language":"zh-CN,zh;q=0.9","Referer":"https://sz.esf.fang.com/"}
          for url in ["https://sz.esf.fang.com/housing/","https://sz.esf.fang.com/housing/__0_2_0_0_9_0_0_0/"]:
            r=requests.get(url,headers=h,timeout=25)
            print("\nURL",url,"STATUS",r.status_code,"LEN",len(r.content),"FINAL",r.url)
            soup=BeautifulSoup(r.text,"html.parser")
            node=soup.find(string=lambda x:x and "红树西岸" in x)
            if not node:
              # print candidate list containers/classes
              for sel in [".houseList",".listContent",".list",".listBox",".listinfo",".houseList_dl","dl"]:
                found=soup.select(sel)
                if found: print("SEL",sel,"COUNT",len(found),"SAMPLE",found[0].get_text(" ",strip=True)[:1200])
              continue
            cur=node.parent
            for i in range(6):
              if not cur: break
              print("ANCESTOR",i,"TAG",cur.name,"CLASS",cur.get("class"),"ID",cur.get("id"))
              print(str(cur)[:7000])
              cur=cur.parent
