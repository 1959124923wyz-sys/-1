name: Probe Shenzhen Fang map endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-shenzhen-fang-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract Fang map API constants
        shell: python
        run: |
          import requests,re
          h={"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/154.0 Safari/537.36","Referer":"https://map.fang.com/"}
          for fn in ("app.js","vendor.js","manifest.js"):
            url=f"https://static.soufunimg.com/map/ditu/js/modules/vueMap/js/{fn}?v=20250820001"
            t=requests.get(url,headers=h,timeout=25).text
            print("FILE",fn,"LEN",len(t))
            for pat in [r'API_URL.{0,180}',r'QmSG.{0,1200}',r'ajaxSearch.{0,500}',r'getBaiduCoord.{0,500}',r'/ws/[^"\']{1,180}']:
              hits=re.findall(pat,t,re.I)
              for x in hits[:30]: print("MATCH",pat,repr(x))
