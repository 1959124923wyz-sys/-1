name: Germany crime map UI smoke test

on:
  pull_request:
    paths:
      - 'dao-radar/site/germany-homicide-map/**'
      - '.github/workflows/germany-homicide-map-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: germany-crime-map-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  map-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dao-radar/site/germany-homicide-map/requirements.txt
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Validate Python scripts and crime data
        run: |
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/update_cases.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/update_crime_categories.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/update_berlin_categories.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/update_berlin_heatmap.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/validate_berlin_heatmap.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/build_pks_violent_2025.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/build_berlin_violent_atlas.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/validate_official_violence_layers.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/smoke_test_ui.py
          python -m py_compile dao-radar/site/germany-homicide-map/scripts/validate_city_layers.py
          node --check dao-radar/site/germany-homicide-map/js/core/geo-stats.js
          node --check dao-radar/site/germany-homicide-map/js/core/config.js
          node --check dao-radar/site/germany-homicide-map/js/core/data-model.js
          node --check dao-radar/site/germany-homicide-map/js/panels/drawer-drag.js
          node --check dao-radar/site/germany-homicide-map/js/panels/state-panel.js
          node --check dao-radar/site/germany-homicide-map/js/layers/recent-events.js
          node --check dao-radar/site/germany-homicide-map/js/app.js
          node --check dao-radar/site/germany-homicide-map/js/layers/city-detail.js

      - name: Refresh Berlin official theft heatmap
        run: python dao-radar/site/germany-homicide-map/scripts/update_berlin_heatmap.py

      - name: Validate Berlin official heatmap
        run: python dao-radar/site/germany-homicide-map/scripts/validate_berlin_heatmap.py

      - name: Validate expanded crime data
        run: |
          python dao-radar/site/germany-homicide-map/scripts/validate_crime_data.py
          python dao-radar/site/germany-homicide-map/scripts/validate_city_layers.py

      - name: Validate official violence baselines
        run: python dao-radar/site/germany-homicide-map/scripts/validate_official_violence_layers.py

      - name: Start local map server
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory dao-radar/site/germany-homicide-map >/tmp/germany-map-server.log 2>&1 &
          echo $! > /tmp/germany-map-server.pid
          sleep 1

      - name: Simulate blocked OSM tiles and render map
        env:
          SMOKE_URL: http://127.0.0.1:8765/
          SMOKE_SCREENSHOT: /tmp/germany-crime-map-national.png
        run: python dao-radar/site/germany-homicide-map/scripts/smoke_test_ui.py

      - name: Upload rendered screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: germany-crime-map-smoke
          path: /tmp/germany-crime-map-*.png
          if-no-files-found: warn
