name: Rebuild official violence baselines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: violent-layer-baseline-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt

      - name: Build nationwide PKS layer
        run: python dao-radar/site/germany-homicide-map/scripts/build_pks_violent_2025.py

      - name: Build Berlin local violence layer
        run: python dao-radar/site/germany-homicide-map/scripts/build_berlin_violent_atlas.py

      - name: Validate generated baselines
        run: python dao-radar/site/germany-homicide-map/scripts/validate_official_violence_layers.py

      - name: Commit baseline refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/germany-homicide-map/data/pks_violent_2025.json
          git add dao-radar/site/germany-homicide-map/data/berlin_violent_2025.geojson
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh official violence baselines"
            git pull --rebase origin "$(git branch --show-current)"
            git push
          else
            echo "No official baseline changes"
          fi
