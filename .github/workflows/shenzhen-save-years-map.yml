name: Shenzhen save-years map daily refresh

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/shenzhen-save-years-map.yml'

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize the shared GitHub Pages environment across site publishers.
# The latest source/data must not collide with another active Pages deployment.
concurrency:
  group: shared-github-pages-deployment
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dao-radar/site/shenzhen-save-years-map/requirements.txt

      - name: Install dependencies
        run: pip install -r dao-radar/site/shenzhen-save-years-map/requirements.txt

      - name: Refresh prices and discover communities
        run: python dao-radar/site/shenzhen-save-years-map/scripts/update_prices.py --discover-pages 25 --detail-limit 12 --delay 0.65

      - name: Run parser tests
        run: python -m unittest discover -s dao-radar/site/shenzhen-save-years-map/tests -p 'test_*.py'

      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- dao-radar/site/shenzhen-save-years-map/data/; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dao-radar/site/shenzhen-save-years-map/data/
            git commit -m "data: refresh Shenzhen save-years map"
            git pull --rebase origin main
            git push
          else
            echo "No data changes"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dao-radar/site

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
