name: Finalize Germany homicide map 90-day data

on:
  push:
    branches: [expand-germany-homicide-90d]
    paths:
      - 'dao-radar/site/germany-homicide-map/data/cases.json'
      - 'dao-radar/site/germany-homicide-map/scripts/update_cases.py'
      - '.github/workflows/germany-homicide-backfill-90d.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: germany-homicide-finalize-90d
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt

      - name: Geocode and validate rolling 90-day data
        env:
          APP_CONTACT: https://github.com/1959124923wyz-sys/-1
        run: python dao-radar/site/germany-homicide-map/scripts/update_cases.py

      - name: Commit normalized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/germany-homicide-map/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: finalize geocoded 90-day Germany homicide set"
            git push
          else
            echo "No data changes"
          fi

# rerun after final smoke-test hardening
