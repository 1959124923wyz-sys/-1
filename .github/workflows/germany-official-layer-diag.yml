name: Diagnose official crime sources
on:
  push:
    branches: [violence-overview-90d]
    paths:
      - 'dao-radar/site/germany-homicide-map/scripts/diag_official_layers.py'
      - '.github/workflows/germany-official-layer-diag.yml'
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 openpyxl
      - run: python dao-radar/site/germany-homicide-map/scripts/diag_official_layers.py
