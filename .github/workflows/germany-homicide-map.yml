name: Germany homicide map updater

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/germany-homicide-map.yml'
  pull_request:
    paths:
      - '.github/workflows/germany-homicide-map.yml'
      - 'dao-radar/site/germany-homicide-map/**'

permissions:
  contents: write

concurrency:
  group: germany-homicide-map-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dao-radar/site/germany-homicide-map/requirements.txt

      - name: Install dependencies
        run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt

      - name: Refresh rolling 30-day data
        env:
          APP_CONTACT: https://github.com/1959124923wyz-sys/-1
        run: python dao-radar/site/germany-homicide-map/scripts/update_cases.py

      - name: Commit refreshed data
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/germany-homicide-map/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Germany homicide map"
            git push
          else
            echo "No map data changes"
          fi
