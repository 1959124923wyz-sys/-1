name: Germany crime map updater

on:
  workflow_dispatch:
    inputs:
      full_backfill:
        description: 'Run a full 90-day Berlin backfill'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 20 * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/germany-homicide-map.yml'
      - 'dao-radar/site/germany-homicide-map/scripts/**'
      - 'dao-radar/site/germany-homicide-map/index.html'
      - 'dao-radar/site/germany-homicide-map/css/**'
      - 'dao-radar/site/germany-homicide-map/js/**'
      - 'dao-radar/site/germany-homicide-map/data/city_layers.json'
      - 'dao-radar/site/germany-homicide-map/requirements.txt'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: germany-homicide-map-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dao-radar/site/germany-homicide-map/requirements.txt

      - name: Install dependencies
        run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt

      - name: Validate map JavaScript syntax
        run: |
          node --check dao-radar/site/germany-homicide-map/js/core/geo-stats.js
          node --check dao-radar/site/germany-homicide-map/js/core/config.js
          node --check dao-radar/site/germany-homicide-map/js/core/data-model.js
          node --check dao-radar/site/germany-homicide-map/js/panels/drawer-drag.js
          node --check dao-radar/site/germany-homicide-map/js/panels/state-panel.js
          node --check dao-radar/site/germany-homicide-map/js/layers/recent-events.js
          node --check dao-radar/site/germany-homicide-map/js/app.js
          node --check dao-radar/site/germany-homicide-map/js/layers/city-detail.js

      - name: Validate city-layer registry JSON
        run: python -m json.tool dao-radar/site/germany-homicide-map/data/city_layers.json >/dev/null

      - name: Ensure nationwide 2025 property heatmap data
        run: |
          if [ ! -f dao-radar/site/germany-homicide-map/data/pks_property_2025.json ]; then
            python dao-radar/site/germany-homicide-map/scripts/build_pks_property_2025.py
          else
            echo "Property heatmap data already present; skip static annual rebuild"
          fi

      - name: Ensure Munich 2025 district layer
        run: |
          python dao-radar/site/germany-homicide-map/scripts/build_munich_local_2025.py

      - name: Ensure Hamburg 2025 neighborhood layer
        run: |
          python dao-radar/site/germany-homicide-map/scripts/build_hamburg_local_2025.py

      - name: Ensure Leipzig 2025 neighborhood layer
        run: |
          python dao-radar/site/germany-homicide-map/scripts/build_leipzig_local_2025.py

      - name: Ensure Chemnitz 2025 neighborhood layer
        run: |
          python dao-radar/site/germany-homicide-map/scripts/build_chemnitz_local_2025.py

      - name: Ensure Dresden 2025 neighborhood layer
        run: |
          python dao-radar/site/germany-homicide-map/scripts/build_dresden_local_2025.py

      - name: Validate city detail registry
        run: python dao-radar/site/germany-homicide-map/scripts/validate_city_layers.py

      - name: Refresh homicide data
        env:
          APP_CONTACT: https://github.com/1959124923wyz-sys/-1
        run: python dao-radar/site/germany-homicide-map/scripts/update_cases.py

      - name: Refresh robbery, sexual, violence and property data
        env:
          APP_CONTACT: https://github.com/1959124923wyz-sys/-1
          CRIME_LOOKBACK_DAYS: '4'
        run: python dao-radar/site/germany-homicide-map/scripts/update_crime_categories.py

      - name: Refresh direct Polizei Berlin source
        env:
          BERLIN_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_backfill && '90' || '5' }}
        run: python dao-radar/site/germany-homicide-map/scripts/update_berlin_categories.py

      - name: Refresh Berlin official theft heatmap
        run: python dao-radar/site/germany-homicide-map/scripts/update_berlin_heatmap.py

      - name: Validate Berlin official heatmap
        run: python dao-radar/site/germany-homicide-map/scripts/validate_berlin_heatmap.py

      - name: Commit refreshed data
        id: save
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dao-radar/site/germany-homicide-map/data/
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Germany crime map"
            # UI/source commits may land while this updater is running.
            # Rebase the generated-data commit before pushing instead of failing
            # with a non-fast-forward error.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No map data changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Pages
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.save.outputs.changed == 'true')
        uses: actions/configure-pages@v5

      - name: Upload complete site
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.save.outputs.changed == 'true')
        uses: actions/upload-pages-artifact@v4
        with:
          path: dao-radar/site

      - name: Deploy Pages
        id: deployment
        if: github.event_name != 'pull_request' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.save.outputs.changed == 'true')
        uses: actions/deploy-pages@v4
