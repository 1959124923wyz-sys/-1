name: Brandenburg source probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dao-radar/site/germany-homicide-map/scripts/update_brandenburg.py'
      - 'dao-radar/site/germany-homicide-map/scripts/audit_brandenburg.py'
      - '.github/workflows/germany-brandenburg-probe.yml'

permissions:
  contents: read

concurrency:
  group: germany-brandenburg-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dao-radar/site/germany-homicide-map/requirements.txt

      - name: Install dependencies
        run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt

      - name: Audit 14 days of Brandenburg events and geocodes
        run: python dao-radar/site/germany-homicide-map/scripts/audit_brandenburg.py
