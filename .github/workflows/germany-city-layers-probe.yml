name: Germany city detail layers probe
on:
  push:
    branches: [main]
    paths:
      - 'dao-radar/site/germany-homicide-map/scripts/build_leipzig_local_2025.py'
      - 'dao-radar/site/germany-homicide-map/scripts/build_chemnitz_local_2025.py'
      - 'dao-radar/site/germany-homicide-map/scripts/build_dresden_local_2025.py'
      - '.github/workflows/germany-city-layers-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r dao-radar/site/germany-homicide-map/requirements.txt
      - name: Build Leipzig
        run: python dao-radar/site/germany-homicide-map/scripts/build_leipzig_local_2025.py
      - name: Build Chemnitz
        run: python dao-radar/site/germany-homicide-map/scripts/build_chemnitz_local_2025.py
      - name: Build Dresden
        run: python dao-radar/site/germany-homicide-map/scripts/build_dresden_local_2025.py
      - name: Validate feature counts
        run: |
          python - <<'PY'
          import json, pathlib
          root=pathlib.Path('dao-radar/site/germany-homicide-map/data')
          expected={'leipzig_local_2025.geojson':63,'chemnitz_local_2025.geojson':39,'dresden_local_2025.geojson':61}
          for fn,n in expected.items():
              j=json.loads((root/fn).read_text())
              print(fn,len(j['features']),j['meta'].get('scope'))
              assert len(j['features'])==n
          PY
