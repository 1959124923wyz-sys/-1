name: Melbourne climbing map refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * *"
  push:
    branches: [main]
    paths:
      - "dao-radar/site/melbourne-climbing-map/data/seed.json"
      - "dao-radar/site/melbourne-climbing-map/scripts/update_gyms.py"
      - ".github/workflows/melbourne-climbing-refresh.yml"

permissions:
  contents: write

concurrency:
  group: melbourne-climbing-map-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh geocodes, source health and OSM candidates
        working-directory: dao-radar/site/melbourne-climbing-map
        run: python scripts/update_gyms.py

      - name: Commit generated data
        run: |
          git config user.name "melbourne-climbing-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dao-radar/site/melbourne-climbing-map/data/gyms.json \
                  dao-radar/site/melbourne-climbing-map/data/gyms.js \
                  dao-radar/site/melbourne-climbing-map/data/geocode_cache.json \
                  dao-radar/site/melbourne-climbing-map/data/osm_candidates.json
          if git diff --cached --quiet; then
            echo "No generated data changes."
          else
            git commit -m "data: refresh Melbourne climbing map"
            git push
          fi
